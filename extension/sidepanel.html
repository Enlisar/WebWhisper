<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebWhisper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div id="app" class="app-root">
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 6v12M13 3v18M17 8v8M21 11v2" /></svg>
    <h1>WebWhisper</h1>
  </div>
  <div class="size" role="group" aria-label="Text size">
    <button id="fsMinus" type="button" aria-label="Smaller text">A<span aria-hidden="true">&minus;</span></button>
    <button id="fsPlus" type="button" aria-label="Larger text">A<span aria-hidden="true">+</span></button>
  </div>
</header>

<div class="site" id="siteRow">
  <span class="site-k">Current page</span>
  <span class="site-v" id="site">&hellip;</span>
</div>
<div id="banner" class="banner" role="alert" hidden></div>

<main id="log" class="log" tabindex="0" aria-label="Conversation">
  <section id="empty" class="empty">
    <h2>Welcome to WebWhisper</h2>
    <p>Your voice-first web companion. Press <kbd>Alt+J</kbd> anytime to unmute or mute your microphone.</p>
    <div class="try">
      <button type="button" class="chip" data-say="What is on this page?">What is on this page?</button>
      <button type="button" class="chip" data-say="How many sections are there?">How many sections are there?</button>
      <button type="button" class="chip" data-say="What can I click here?">What can I click here?</button>
    </div>
    <p class="hint">Hold <kbd>Ctrl</kbd> and hover over any element to read it aloud &middot; Press <kbd>Alt+J</kbd> to unmute.</p>
  </section>
</main>

<footer class="dock">
  <div id="interim" class="interim" aria-live="off"></div>
  <div id="status" class="status" role="status" aria-live="polite" data-state="idle">Ready</div>
  <form id="composer" class="composer" autocomplete="off">
    <input id="input" type="text" aria-label="Type a request" placeholder="Type a request" enterkeyhint="send" spellcheck="false">
    <button id="send" class="btn" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="controls">
    <button id="mic" class="btn mic" type="button" aria-pressed="false" aria-label="Microphone off. Press to turn on.">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18"/></svg>
      <span id="micLabel">Mic off</span>
    </button>
    <button id="stop" class="btn stop" type="button" aria-label="Stop speaking">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
      <span>Stop</span>
    </button>
  </div>
</footer>
</div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
